name: Build and Release (Android & Web)

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag like v1.0.0

permissions:
  contents: write # Required to create GitHub Releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # --- ANDROID BUILD ---
      - name: Decode Firebase Configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            printf '%s' "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart
          fi

      - name: Decode .env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s' "$ENV_FILE" | base64 --decode > .env

      - name: Decode PKCS12 Keystore & Create key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.p12"
          cat <<EOF > android/key.properties
          storeFile=${{ runner.temp }}/release.p12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Build Android APK & App Bundle
        run: |
          flutter build apk --release --dart-define-from-file=.env
          flutter build appbundle --release --dart-define-from-file=.env

      - name: Clean up signing files
        if: always()
        run: rm -f "${{ runner.temp }}/release.p12" android/key.properties

      - name: Build Android APK & App Bundle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release --dart-define-from-file=.env
          flutter build appbundle --release --dart-define-from-file=.env

      - name: Clean up keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.p12"

      # --- WEB BUILD ---
      - name: Build Web Bundle
        run: flutter build web --release --dart-define-from-file=.env

      - name: Archive Web Build
        run: tar -czvf build/web-release.tar.gz -C build/web .

      # --- GITHUB RELEASE ---
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/web-release.tar.gz
