name: edge_mapper
description: Offline-first OpenStreetMap field & hiking mapper powered by Hybrid Firebase AI and on-device vision.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Firebase AI Logic & Cloud Sync (works when online & configured)
  firebase_core: '>=3.12.0 <5.0.0'
  firebase_ai: '>=2.0.0 <6.0.0'
  firebase_auth: '>=5.0.0 <7.0.0'
  firebase_app_check: '>=0.4.7 <1.0.0'

  # On-device Offline Vision & Multilingual OCR (fast & safe on Pixel 6a 6GB RAM)
  google_mlkit_image_labeling: '>=0.13.0 <2.0.0'
  google_mlkit_text_recognition: '>=0.14.0 <2.0.0'

  # Hardware: Camera, GPS, Connectivity & Networking
  image_picker: ^1.1.2
  geolocator: '>=12.0.0 <15.0.0'
  connectivity_plus: '>=6.0.0 <8.0.0'
  http: ^1.2.0
  crypto: ^3.0.3
  web: ^1.1.0

  # Local Offline Persistence & Export
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  share_plus: '>=11.0.0 <14.0.0'
  uuid: ^4.5.1
  intl: '>=0.19.0 <0.21.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
