org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false
# Enabled explicitly (instead of removing) so Flutter's DisableBuiltInKotlinMigration
# does not re-add android.builtInKotlin=false on the next build.
android.builtInKotlin=true
# Kept false for now because upstream plugins (firebase_*, geolocator_android,
# sqflite_android) still use legacy Groovy DSL blocks (lintOptions / compileSdkVersion).
android.newDsl=false
